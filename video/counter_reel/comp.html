<!doctype html><html><head><meta charset="utf-8"><style>
/* Counter reel (1080x1920), halfway between the minimal and trailer styles. Driven by data.json; render(f) is deterministic.
   A run of no's lands as X tiles under the headline, the last no can freeze with a tally line, then a check and confetti for the yes. */
@font-face{font-family:M;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:M;color:#fff}

.pill.cta{font-size:58px;padding:26px 50px 28px;border-radius:50px}
.hl{position:relative;display:inline-block;z-index:0}
.hl i{position:absolute;left:-8px;right:-8px;top:4px;bottom:2px;background:#FCEF00;border-radius:9px;z-index:-1;transform-origin:left center}

/* inserts: a short clip someone describes plays in a retro player window over a dimmed freeze, after a download bar fills */
.dl{position:absolute;left:50%;width:640px;background:linear-gradient(#f7f7f7,#dadada);color:#111;border-radius:18px;padding:20px 26px 24px;box-shadow:0 18px 46px rgba(0,0,0,.45),inset 0 1px 0 #fff;opacity:0;z-index:26}
.dl .row{display:flex;align-items:center;gap:18px;font-weight:800;font-size:40px}

.pw .tb{height:62px;display:flex;align-items:center;gap:14px;padding:0 4px;color:#222;font-weight:800;font-size:34px}
.pw .bt{margin-left:auto;display:flex;gap:10px}.pw .bt b{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;background:linear-gradient(#fdfdfd,#c4c4c4);box-shadow:inset 0 0 0 2px #8a8a8a}
.pw .scr{position:relative;border-radius:8px;overflow:hidden;background:#000}
.pw canvas{display:block;width:100%}
.pw .scan{position:absolute;inset:0;background:repeating-linear-gradient(rgba(0,0,0,.16) 0 2px,rgba(0,0,0,0) 2px 5px),radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 60%,rgba(0,0,0,.35) 100%)}
.pw .ctl{height:58px;display:flex;align-items:center;gap:18px;padding:0 8px}
.pw .pl{width:0;height:0;border-left:28px solid #2a2a2a;border-top:17px solid transparent;border-bottom:17px solid transparent}
.pw .ctl .pb{flex:1;height:18px}
.stk{position:absolute;font-family:'Noto Color Emoji';font-size:150px;line-height:1;opacity:0;z-index:24;filter:drop-shadow(0 12px 22px rgba(0,0,0,.45))}
</style></head><body>
<div id="vid"><img id="im"><div id="vig"></div><div id="topshade"></div><div id="red"></div></div>
<div id="pills"></div><div id="link"></div>
<div id="plate"></div><div id="tiles"></div>
<div id="slams"></div><div id="zero"></div>
<div id="chk"><svg width="250" height="250" viewBox="0 0 24 24"><path d="M5 12.6l4.4 4.4L19.2 7" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div id="fin"></div>
<canvas id="conf" width="1080" height="1920"></canvas>
<div id="badge"></div><div id="cscrim"></div><div id="ctitle"></div><div id="csub"></div>
<div id="stks"></div><div id="ovs"></div><div id="ins"></div>
<div id="cap"></div>
<div id="flash"></div>
<div id="bar"></div>
<script>
const FPS=30,W=1080,H=1920;let D;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>{x=cl(x);return 1-Math.pow(1-x,3)};
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=cl(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const prog=(t,s,d=0.4)=>eo((t-s)/d);
const io=(t,s,e,d=0.35)=>Math.min(prog(t,s,d),1-prog(t,e-0.25,0.25));
const $=id=>document.getElementById(id);
const pad=(n,k=5)=>String(n).padStart(k,'0');
const hl=s=>s.replace(/\*\*(.+?)\*\*/g,'<span class="hl"><i></i>$1</span>');
const rnd=s=>{let x=Math.sin(s*12.9898)*43758.5453;return x-Math.floor(x)};
async function setImg(el,src){if(el.dataset.s===src)return;el.dataset.s=src;await new Promise(r=>{el.onload=r;el.onerror=()=>{console.log('IMGERR '+src);r()};el.src=src});if(el.decode){try{await el.decode()}catch(e){}}}
const XSVG='<svg width="440" height="440" viewBox="0 0 440 440"><g stroke-linecap="round"><path d="M95 95L345 345M345 95L95 345" stroke="#fff" stroke-width="96"/><path d="M95 95L345 345M345 95L95 345" stroke="#FF3B30" stroke-width="66"/></g></svg>';
const TX='<svg width="52" height="52" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/></svg>';
const TOK='<svg width="56" height="56" viewBox="0 0 24 24"><path d="M5 12.6l4.4 4.4L19.2 7" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SLAM_IN=0.12,SLAM_FLY=0.22;
function slamHoldEnd(i){const x=D.xs[i];return (i===D.xs.length-1&&D.fz)?D.fz[1]-0.16:x+0.30}
const land=i=>slamHoldEnd(i)+SLAM_FLY-0.02;
function tileCount(t){let n=0;D.xs.forEach((x,i)=>{if(t>=land(i))n=i+1});
 // a '?' tile takes its slot while it waits (q: [start, end, slot, pulse faster from])
 D.q.forEach(q=>{if(t>=q[0]&&n<q[2]+1)n=q[2]+1});if(t>=D.check)n=Math.max(n,D.xs.length+1);return n}
function tileX(i,n){const tw=84,g=12,w=n*tw+(n-1)*g;return (W-w)/2+i*(tw+g)}
// an mp3 with no picture: a segmented bar visualiser drawn from the clip's own audio (bars and peak caps per frame, 0 to 1)
function drawViz(c,v,pk){const g=c.getContext('2d'),w=c.width,h=c.height,nb=v.length,gap=10,side=44,bw=(w-2*side-gap*(nb-1))/nb,base=h-46,top=40;
 g.fillStyle='#040704';g.fillRect(0,0,w,h);g.fillStyle='rgba(155,255,126,.07)';for(let y=base;y>top;y-=34)g.fillRect(side-10,y,w-2*side+20,2);
 const gr=g.createLinearGradient(0,base,0,top);gr.addColorStop(0,'#1E9B2E');gr.addColorStop(0.62,'#6EF25B');gr.addColorStop(1,'#EAFF70');
 v.forEach((x,i)=>{const X=side+i*(bw+gap),bh=Math.max(8,x*(base-top));g.fillStyle=gr;g.fillRect(X,base-bh,bw,bh);
  g.fillStyle='rgba(4,7,4,.6)';for(let y=base-13;y>base-bh;y-=15)g.fillRect(X,y,bw,4);
  g.fillStyle='rgba(110,242,91,.16)';g.fillRect(X,base+6,bw,Math.min(34,bh*0.25));
  const p=Math.max(x,pk[i])*(base-top);g.fillStyle='#F2FFD8';g.fillRect(X,base-p-10,bw,6);});}
window.render=async function(f){
 const t=f/FPS,im=$('im');
 // ---- shot and framing ----
 let sh=D.shots[0];for(const s of D.shots)if(t>=s.t0-1e-4)sh=s;
 // steps: a reframe inside one shot, cut on a word ({t, z0, z1, fx, fy, sx, sy, pop})
 let fr={t0:sh.t0,z0:sh.z0,z1:sh.z1,fx:sh.fx,fy:sh.fy,sx:sh.sx,sy:sh.sy,pop:sh.pop};
 for(const s of (sh.steps||[]))if(t>=s.t-1e-4)fr={t0:s.t,z0:s.z0,z1:s.z1,fx:s.fx,fy:s.fy,sx:s.sx,sy:s.sy,pop:s.pop};
 const p=(t-fr.t0)/(sh.t1-fr.t0);let z=fr.z0+(fr.z1-fr.z0)*(sh.freeze?eio(p):p);
 if(fr.pop)z*=1+0.06*(1-eo((t-fr.t0)/0.16));
 let wb=0;for(const w of D.whips){const d=Math.abs(t-w);if(d<0.12){const k=1-d/0.12;wb=Math.max(wb,k);}}
 z*=1+0.07*wb;
 let tx=fr.sx*W-fr.fx*W*z,ty=fr.sy*H-fr.fy*H*z;tx=cl(tx,W-W*z,0);ty=cl(ty,H-H*z,0);
 // shake after each X slam and the check
 let sk=0;for(const x of D.xs){const d=t-x;if(d>=0&&d<0.28)sk=Math.max(sk,1-d/0.28);}
 {const d=t-D.check;if(d>=0&&d<0.3)sk=Math.max(sk,1-d/0.3);}
 const ox=(rnd(f*1.7)-0.5)*2*18*sk,oy=(rnd(f*3.1+7)-0.5)*2*18*sk;
 tx=cl(tx+ox,W-W*z-2,2);ty=cl(ty+oy,H-H*z-2,2);
 im.style.transform=`translate(${tx.toFixed(2)}px,${ty.toFixed(2)}px) scale(${z.toFixed(5)})`;
 let filt='';if(wb>0.01)filt+=`blur(${(wb*9).toFixed(2)}px) `;
 if(sh.grey){const g=eo((t-sh.t0)/0.18);filt+=`grayscale(${(0.85*g).toFixed(3)}) contrast(${(1+0.1*g).toFixed(3)}) brightness(${(1-0.08*g).toFixed(3)})`;}
 if(sh.bright){const g=1-eo((t-sh.t0)/0.5);filt+=`brightness(${(1+0.25*g).toFixed(3)}) saturate(${(1+0.25*g).toFixed(3)})`;}
 for(const n of (D.inserts||[]))if(t>=n.s&&t<n.e){const k=eo((t-n.s)/0.22);filt+=` blur(${(16*k).toFixed(2)}px) brightness(${(1-0.5*k).toFixed(3)})`;}
 im.style.filter=filt.trim()||'none';
 await setImg(im,'frames/'+pad(Math.min(D.nf,f+1))+'.jpg');
 // red edge flash on each no
 let rd=0;for(const x of D.xs){const d=t-x;if(d>=0&&d<0.35)rd=Math.max(rd,0.6*(1-d/0.35));}
 $('red').style.opacity=rd.toFixed(3);
 {const d=t-D.check;$('flash').style.opacity=(d>=0&&d<0.2?0.7*(1-d/0.2):0).toFixed(3);}
 $('bar').style.width=(W*t/(D.total/FPS))+'px';
 // ---- pills ----
 [...$('pills').children].forEach((el,i)=>{const P=D.pills[i];el.style.opacity=io(t,P.s,P.e);el.style.transform=`translate(-50%,${((1-prog(t,P.s))*(P.sub?18:26)).toFixed(2)}px) scale(${(0.96+0.04*prog(t,P.s,0.3)).toFixed(4)})`;
  el.querySelectorAll('.hl i').forEach(x=>{x.style.transform=`scaleX(${prog(t,P.wipe===undefined?P.s+0.4:P.wipe,0.4)})`});});
 const cta=D.pills.find(p=>p.cta);if(cta){const q=prog(t,cta.s+0.35,0.35);$('link').style.opacity=q;$('link').style.transform=`translate(-50%,${((1-q)*16).toFixed(2)}px)`;}
 // ---- counter strip ----
 const so=D.stripOn?Math.min(prog(t,D.stripOn[0],0.3),1-prog(t,D.stripOn[1]-0.25,0.25)):0;const n=D.stripOn?tileCount(t):0;
 // the row re-centres smoothly as tiles are added
 const pl=$('plate');
 let nn=n;{let last=-9;D.xs.forEach((x,i)=>{const at=land(i);if(t>=at)last=Math.max(last,at)});D.q.forEach(q=>{if(t>=q[0])last=Math.max(last,q[0])});
  const k=eo((t-last)/0.22);nn=n>1?(n-1)+k:n;}
 const tw=84,g=12,wN=nn*tw+(nn-1)*g;pl.style.left=((W-wN)/2-14)+'px';pl.style.width=(wN+28)+'px';pl.style.opacity=n>0?so:0;
 const tiles=[...$('tiles').children];
 tiles.forEach((el,i)=>{if(i>=n){el.style.opacity=0;return}
  let kind='x',born=0;const qq=D.q.find(q=>q[2]===i);
  if(i<D.xs.length){born=land(i);if(qq&&t>=qq[0]&&t<land(i)){kind=t<D.xs[i]?'q':'qx';born=qq[0];}}
  else{kind=t<D.check?'q':'ok';born=t<D.check?(qq?qq[0]:D.check):D.check;}
  const kk=kind==='qx'?'x':kind;if(el.dataset.k!==kk){el.dataset.k=kk;el.className=kk==='ok'?'tile ok':(kk==='q'?'tile q':'tile x');el.innerHTML=kk==='ok'?TOK:(kk==='q'?'?':TX);}
  if(kind==='qx'){el.style.opacity=so*(1-eo((t-D.xs[i])/0.12));}else el.style.opacity=so;
  const b=back((t-born)/0.28);let s=0.4+0.6*b;
  if(kind==='q'){const fast=qq&&t>qq[3];s*=1+(fast?0.1:0.06)*Math.sin((t-born)*Math.PI*2*(fast?3.2:1.6));}
  const xx=tileX(i,nn);el.style.left=xx+'px';el.style.transform=`scale(${s.toFixed(4)})`;});
 // ---- X slams ----
 [...$('slams').children].forEach((el,i)=>{const x=D.xs[i],he=slamHoldEnd(i);let o=0,cx=540,cy=1020,s=1,r=0;
  const XS_=D.xScale||1,HOLD=D.xHold||0.30;
  if(D.noTiles){if(t>=x-0.02&&t<x+HOLD+0.14){if(t<x+SLAM_IN){const q=(t-x+0.02)/(SLAM_IN+0.02);s=(2.4-1.4*back(q))*XS_;r=-14*(1-eo(q));o=cl(q*2.5);}
    else if(t<x+HOLD){s=XS_;o=1;}else{const q=(t-x-HOLD)/0.14;s=XS_*(1-0.5*q);o=1-q;}}}
  else if(t>=x-0.02&&t<he+SLAM_FLY){
   if(t<x+SLAM_IN){const q=(t-x+0.02)/(SLAM_IN+0.02);s=2.4-1.4*back(q);r=-14*(1-eo(q));o=cl(q*2.5);}
   else if(t<he){s=1+0.03*Math.sin((t-x)*18)*Math.exp(-(t-x)*6);o=1;}
   else{const q=eio((t-he)/SLAM_FLY);const txx=tileX(i,Math.max(i+1,tileCount(he)))+42,tyy=388;cx=540+(txx-540)*q;cy=1020+(tyy-1020)*q;s=1-(1-84/440*0.9)*q;o=1;r=-8*q;}
  }
  el.style.opacity=o;el.style.transform=`translate(${(cx-220).toFixed(1)}px,${(cy-220).toFixed(1)}px) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(4)})`;});
 if(D.fz){const a=D.fz[0]+0.05,e=D.fz[1]-0.14;const q=back((t-a)/0.25);const zo=$('zero');zo.style.opacity=(t>=a&&t<e+0.1)?cl((t-a)/0.08)*(1-cl((t-e)/0.1)):0;zo.style.transform=`translate(-50%,0) scale(${(0.5+0.5*q).toFixed(4)})`;}
 // ---- check, FINALLY, confetti ----
 {const c=D.check,e=D.checkEnd;const ch=$('chk'),fi=$('fin');
  if(t>=c-0.02&&t<e){const q=back((t-c+0.02)/0.2);const out=1-eo((t-(e-0.1))/0.1);ch.style.opacity=cl((t-c+0.02)/0.06)*out;ch.style.transform=`scale(${((0.3+0.7*q)*out).toFixed(4)}) rotate(${(-10*(1-eo((t-c)/0.25))).toFixed(2)}deg)`;
   const q2=back((t-c-0.12)/0.22);fi.style.opacity=(t>=c+0.1?cl((t-c-0.1)/0.06):0)*out;fi.style.transform=`translate(-50%,0) scale(${((0.4+0.6*q2)*out).toFixed(4)}) rotate(-4deg)`;}
  else{ch.style.opacity=0;fi.style.opacity=0;}
  const cv=$('conf'),cx=cv.getContext('2d');cx.clearRect(0,0,W,H);const dt=t-c;
  if(dt>=0&&dt<1.6){const COL=['#FCEF00','#22C55E','#FF3B30','#3B82F6','#FFFFFF','#FF7AC6','#FF9F1C'];
   for(let i=0;i<110;i++){const side=i%2?1:-1,ang=(-90+side*(12+rnd(i+1)*58))*Math.PI/180,sp=1100+rnd(i+7)*1300,x0=540+side*40,y0=820;
    const tt=Math.max(0,dt-rnd(i+3)*0.06);const drag=Math.exp(-tt*1.6);const vx=Math.cos(ang)*sp,vy=Math.sin(ang)*sp;
