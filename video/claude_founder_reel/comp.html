<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;font-weight:500;src:url(fonts/montserrat-latin-500-normal.woff2)}
@font-face{font-family:M;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:MI;font-weight:900;font-style:italic;src:url(fonts/montserrat-latin-900-italic.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#111;font-family:M;color:#fff}
#stage{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#1c1c1c 0%,#111 60%)}
#vid{position:absolute;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
#vid img{position:absolute;left:0;display:block}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 45%,rgba(0,0,0,.42) 100%)}
#capshade{position:absolute;left:0;right:0;top:1250px;height:520px;background:linear-gradient(rgba(17,17,17,0),rgba(17,17,17,.38) 45%,rgba(17,17,17,0))}
#bar{position:absolute;left:0;top:0;height:8px;background:#FCEF00;z-index:50}
.pill{position:absolute;left:50%;top:150px;background:#fff;color:#111;border-radius:60px;padding:26px 46px;font-weight:700;font-size:46px;letter-spacing:.2px;white-space:nowrap;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.hl{position:relative;display:inline-block;z-index:0}
.hl i{position:absolute;left:-8px;right:-8px;top:2px;bottom:0;background:#FCEF00;border-radius:8px;z-index:-1;transform-origin:left center}
#cap{position:absolute;left:0;right:0;top:1440px;text-align:center;font-weight:800;font-size:68px;letter-spacing:.3px;white-space:nowrap;text-shadow:0 4px 22px rgba(0,0,0,.55)}
#cap span{display:inline-block;padding:6px 14px;margin:0 1px;border-radius:12px}
#cap span.on{background:#FCEF00;color:#111;text-shadow:none}
#q{position:absolute;left:80px;width:920px;top:130px;background:#fff;color:#111;border-radius:40px;padding:38px 46px 46px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
#qh{display:flex;align-items:center;gap:18px;margin-bottom:26px;font-weight:600;font-size:30px;color:rgba(17,17,17,.62)}
#qh .ic{width:54px;height:54px;border-radius:14px;background:#111;display:flex;align-items:center;justify-content:center}
#bars{margin-left:auto;display:flex;gap:7px;align-items:center;height:48px}
#bars b{display:block;width:8px;border-radius:4px;background:#111}
#qt{font-weight:600;font-size:50px;line-height:1.36;min-height:204px}
#qt span{display:inline-block;margin-right:13px}
#rank{position:absolute;left:80px;width:920px;top:522px;border-radius:40px;padding:30px 40px 26px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);box-shadow:0 24px 70px rgba(0,0,0,.4)}
#rank h{display:block;font-weight:700;font-size:34px;margin-bottom:18px}
.row{display:flex;align-items:center;gap:22px;height:58px;margin-bottom:10px;border-radius:18px;padding:0 20px;font-weight:800;font-size:36px}
.row .n{width:34px}
.row .sk{height:18px;border-radius:9px;background:rgba(255,255,255,.2)}
#r1{background:#FCEF00;color:#111}
.lab{font-weight:500;font-size:22px;color:rgba(255,255,255,.6);margin-top:8px}
#one{position:absolute;left:50%;top:140px;display:flex;align-items:center;gap:22px;background:#fff;color:#111;border-radius:70px;padding:18px 46px 18px 18px;font-weight:700;font-size:46px;white-space:nowrap;box-shadow:0 18px 50px rgba(0,0,0,.35)}
#one .c{width:92px;height:92px;border-radius:50%;background:#FCEF00;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:56px}
#end{position:absolute;inset:0;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:40}
#endpill{background:#fff;color:#111;border-radius:60px;padding:26px 60px;font-weight:700;font-size:50px;margin-top:10px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
</style></head><body>
<div id="stage"></div>
<div id="vid"><img id="im"><div id="vig"></div><div id="capshade"></div></div>
<div id="q"><div id="qh"><div class="ic"><svg width="32" height="24" viewBox="0 0 32 24"><rect x="1" y="3" width="20" height="18" rx="5" fill="#fff"/><path d="M23 9l8-5v16l-8-5z" fill="#fff"/></svg></div><div>Founder, video call</div><div id="bars"><b></b><b></b><b></b><b></b><b></b></div></div><div id="qt"></div></div>
<div id="rank"><h>Top companies, street polling</h><div class="row" id="r1"><div class="n">1</div><div>Stradvert</div></div><div class="row" id="r2"><div class="n">2</div><div class="sk" style="width:380px"></div></div><div class="row" id="r3"><div class="n">3</div><div class="sk" style="width:290px"></div></div><div class="lab">Recreated from the call</div></div>
<div class="pill" id="p0">A founder <span class="hl"><i></i>asked AI</span> who to hire</div>
<div class="pill" id="p1"><span class="hl"><i></i>First company</span> that showed up</div>
<div class="pill" id="p2"><span class="hl"><i></i>Direct response</span> ads</div>
<div class="pill" id="p3">All we care about: <span class="hl"><i></i>conversion</span></div>
<div id="one"><div class="c">1</div><div>Rated number one</div></div>
<div id="cap"></div>
<div id="end"><svg id="logo" width="760" height="500" viewBox="200 320 680 440"><polygon fill="#FCEF00" points="247,590 292,590 318,690 430,427 370,427 492,352 540,427 470,427 345,728 290,728"/><g fill="#fff" font-family="MI" font-weight="900" font-style="italic" font-size="196"><text x="243" y="580" textLength="120" lengthAdjust="spacingAndGlyphs">S</text><text x="436" y="580" textLength="398" lengthAdjust="spacingAndGlyphs">RAD</text><text x="352" y="728" textLength="400" lengthAdjust="spacingAndGlyphs">ERT</text></g></svg><div id="endpill">stradvert.org</div></div>
<div id="bar"></div>
<script>
const FPS=30,DUR=1018/30;
const ease=x=>{x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3)};
const prog=(t,s,d=0.4)=>ease((t-s)/d);
const io=(t,s,e,d=0.4)=>Math.min(prog(t,s,d),1-prog(t,e-0.3,0.3)); // in/out envelope
const $=id=>document.getElementById(id);
const CUTS=[0,2.5,15.7,18.3,19.2333,22.6,25.8667,DUR];
const FQ=[[["Yeah,",3.0],["I",3.1],["basically",3.28],["asked",3.84],["Claude,",4.48,1],["give",5.86],["me",5.94],["the",6.22],["top",6.46,1],["companies",6.94,1],["who",7.6],["do",8.32],["street",8.56],["polling,",9.1]],
[["and",9.64],["then",9.78],["you",9.94],["showed",10.1],["up,",10.28],["the",10.48],["first",10.66,1],["company",10.98,1],["that",12.26],["showed",12.48],["up.",12.64]]];
const CAPS=[
[["Okay,",0.0],["can",0.6],["I",1.0],["ask",1.42]],[["how",1.56],["you",1.72],["found",1.84],["us?",2.1]],
[["I",13.14],["was",13.26],["the",13.32],["first",13.42]],[["company",13.64],["that",13.98],["showed",14.16],["up.",14.4]],
[["I'll",14.6],["take",14.8],["it.",14.96]],[["I'll",15.16],["take",15.32],["it.",15.52]],
[["Pretty",15.86],["much",15.98],["only",16.16],["do",16.52]],[["stuff",16.74],["for",17.16],["ads.",17.94]],[["Direct",18.2],["response",18.38],["ads.",18.7]],
[["That's",19.6],["what",20.0],["we",20.08],["do,",20.18]],[["all",20.6],["we",20.88],["care",21.04],["about",21.24]],[["really",21.48],["is",21.78],["conversion.",21.96]],
[["I've",22.66],["been",22.8],["doing",22.9],["this",23.04]],[["for",23.18],["a",23.32],["while,",23.46]],[["that's",23.7],["why",23.9],["Claude",24.06]],[["rated",24.46],["me",25.22],["number",25.42],["one.",25.64]],
[["Might",25.96],["just",26.16],["be",26.4],["because",26.52]],[["I'm",26.84],["using",27.2],["Claude",27.48]],[["all",27.74],["the",27.94],["time.",28.06]],
[["Maybe",28.28],["they're",28.54],["just",28.76],["trying",28.86]],[["to",29.04],["get",29.16],["me",29.26],["in",29.38]],[["the",29.48],["good",29.58],["book",29.7],["so",29.94]],[["I",30.12],["upgrade",30.26],["my",30.52],["package.",30.72]],[["I",31.14],["don't",31.2],["know.",31.36]]];
const GEND={1:2.6,5:15.7,8:19.25,11:22.55,15:25.9,23:31.72};
let ENV=[];
function pill(el,t,s,e,wipe){const p=io(t,s,e);el.style.opacity=p;el.style.transform=`translate(-50%,${(1-prog(t,s))*26}px)`;const i=el.querySelector('i');if(i)i.style.transform=`scaleX(${prog(t,wipe,0.45)})`;}
window.render=async function(f){
 const t=f/FPS;
 // layout: card during founder section
 const k=Math.min(prog(t,2.75),1-prog(t,12.9));
 const L=80*k,T=930*k,Wd=1080-160*k,Ht=1920-(1920-830)*k;
 const v=$('vid');v.style.left=L+'px';v.style.top=T+'px';v.style.width=Wd+'px';v.style.height=Ht+'px';v.style.borderRadius=(48*k)+'px';
 const im=$('im');let ci=0;for(let i=0;i<CUTS.length-1;i++)if(t>=CUTS[i])ci=i;
 const sp=(t-CUTS[ci])/(CUTS[ci+1]-CUTS[ci]);const sc=1.015+0.04*sp;
 im.style.width=Wd+'px';im.style.top=(-235*k)+'px';im.style.transformOrigin='50% 40%';im.style.transform=`scale(${sc})`;
 $('capshade').style.opacity=1-k;
 const src='frames/'+String(Math.min(1018,f+1)).padStart(5,'0')+'.jpg';
 if(im.dataset.s!==src){im.dataset.s=src;await new Promise(r=>{im.onload=r;im.onerror=r;im.src=src});if(im.decode)try{await im.decode()}catch(e){}}
 $('bar').style.width=(1080*t/DUR)+'px';
 // founder quote card
 const q=$('q');const qp=Math.min(prog(t,2.95),1-prog(t,12.85,0.3));q.style.opacity=qp;q.style.transform=`translateY(${(1-prog(t,2.95))*30}px)`;
 const si=t<9.6?0:1;const qt=$('qt');
 if(qt.dataset.s!=si){qt.dataset.s=si;qt.innerHTML=FQ[si].map(w=>`<span${w[2]?' class="hl"':''}>${w[2]?'<i></i>':''}${w[0]}</span>`).join('');}
 [...qt.children].forEach((s,i)=>{const w=FQ[si][i];const p=prog(t,w[1]-0.05,0.25);s.style.opacity=p;s.style.transform=`translateY(${(1-p)*10}px)`;const ii=s.querySelector('i');if(ii)ii.style.transform=`scaleX(${prog(t,w[1]+0.1,0.35)})`;});
 const e=ENV[f]||0;const sh=[0.55,0.85,1,0.7,0.45];[...$('bars').children].forEach((b,i)=>{const ph=0.75+0.25*Math.sin(f*0.9+i*1.7);const on=(t>=3&&t<=12.9)?e:0;b.style.height=(8+38*on*sh[i]*ph)+'px';});
 // ranking
 const rk=$('rank');rk.style.opacity=Math.min(prog(t,6.46),1-prog(t,12.85,0.3));rk.style.transform=`translateY(${(1-prog(t,6.46))*30}px)`;
 [['r2',7.6],['r3',8.32],['r1',10.66]].forEach(([id,s])=>{const p=prog(t,s);const r=$(id);r.style.opacity=id=='r1'?1:p;r.style.transform=`translateX(${(1-p)*-18}px)`;if(id=='r1'){r.style.background=p>0?`rgba(252,239,0,${p})`:'transparent';r.style.color=p>0.5?'#111':'#fff';r.style.transform='none';r.children[1].style.opacity=p;r.children[0].style.opacity=Math.max(p,prog(t,6.9));}});
 // pills
 pill($('p0'),t,0.15,2.75,0.7);pill($('p1'),t,13.42,16.2,13.7);pill($('p2'),t,18.2,20.2,18.45);pill($('p3'),t,20.6,23.3,21.96);
 const on=$('one');on.style.opacity=io(t,24.46,26.7);on.style.transform=`translate(-50%,${(1-prog(t,24.46))*26}px)`;const c=on.firstChild;const cp=prog(t,25.42);c.style.background=`rgba(252,239,0,${cp})`;c.style.boxShadow=`inset 0 0 0 4px rgba(17,17,17,${0.15*(1-cp)})`;
 // captions
 const cap=$('cap');let gi=-1;for(let i=0;i<CAPS.length;i++)if(t>=CAPS[i][0][1]-0.03)gi=i;
 let show=gi>=0&&k<0.5&&t<31.72;if(show){const end=GEND[gi];if(end&&t>end)show=false;}
 if(!show){cap.style.opacity=0;}else{const g=CAPS[gi];if(cap.dataset.g!=gi){cap.dataset.g=gi;cap.innerHTML=g.map(w=>`<span>${w[0]}</span>`).join('');}
  let wi=0;g.forEach((w,i)=>{if(t>=w[1]-0.03)wi=i});[...cap.children].forEach((s,i)=>s.className=i==wi?'on':'');
  const p=prog(t,g[0][1]-0.03,0.18);cap.style.opacity=p;cap.style.transform=`translateY(${(1-p)*12}px)`;}
 // end card
 const en=$('end');const ep=prog(t,31.72,0.4);en.style.opacity=ep;$('logo').style.transform=`scale(${0.96+0.04*prog(t,31.8,0.6)})`;const pl=$('endpill');const pp=prog(t,32.05,0.4);pl.style.opacity=pp;pl.style.transform=`translateY(${(1-pp)*20}px)`;
};
window.ready=(async()=>{ENV=await (await fetch('env.json')).json();await document.fonts.load('800 60px M');await document.fonts.load('600 60px M');await document.fonts.load('700 60px M');await document.fonts.load('500 60px M');await document.fonts.load('italic 900 60px MI');await document.fonts.ready;})();
</script></body></html>
