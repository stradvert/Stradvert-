<!doctype html><html><head><meta charset="utf-8"><style>
/* Minimal portrait edit (1080x1920). Everything on screen is driven by data.json. render(f) is deterministic. */
@font-face{font-family:M;font-weight:500;src:url(fonts/montserrat-latin-500-normal.woff2)}
@font-face{font-family:M;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:MI;font-weight:900;font-style:italic;src:url(fonts/montserrat-latin-900-italic.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#111;font-family:M;color:#fff}
body{background:radial-gradient(ellipse at 50% 30%,#1c1c1c 0%,#111 60%)}
#vid{position:absolute;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
#vid img{position:absolute;left:0;display:block}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 48%,rgba(0,0,0,.38) 100%)}
#topshade{position:absolute;left:0;right:0;top:0;height:640px;background:linear-gradient(rgba(17,17,17,.5),rgba(17,17,17,0))}
#bro{position:absolute;left:80px;width:920px;overflow:hidden;border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.5);opacity:0}
#bro img{width:100%;height:100%;object-fit:cover;display:block}
#bar{position:absolute;left:0;top:0;height:8px;background:#FCEF00;z-index:50}
.pill{position:absolute;left:50%;top:150px;background:#fff;color:#111;border-radius:60px;padding:26px 46px;font-weight:700;font-size:46px;letter-spacing:.2px;white-space:nowrap;box-shadow:0 18px 50px rgba(0,0,0,.35);display:flex;align-items:center;gap:16px;opacity:0}
.hl{position:relative;display:inline-block;z-index:0}
.hl i{position:absolute;left:-8px;right:-8px;top:2px;bottom:0;background:#FCEF00;border-radius:8px;z-index:-1;transform-origin:left center}
.sub{position:absolute;left:0;right:0;top:268px;text-align:center;font-weight:600;font-size:36px;text-shadow:0 3px 18px rgba(0,0,0,.6);opacity:0}
#cap{position:absolute;left:50%;top:1470px;border-radius:26px;padding:14px 18px;font-weight:800;font-size:64px;letter-spacing:.3px;white-space:nowrap;opacity:0}
#cap.plate{background:rgba(17,17,17,.9);box-shadow:0 16px 44px rgba(0,0,0,.35)}
#cap.bare{text-shadow:0 4px 22px rgba(0,0,0,.55)}
#cap span{display:inline-block;padding:6px 14px;margin:0 1px;border-radius:14px}
#cap span.on{background:#FCEF00;color:#111;text-shadow:none}
#end{position:absolute;inset:0;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:40;opacity:0}
#endpill{background:#fff;color:#111;border-radius:60px;padding:26px 60px;font-weight:700;font-size:50px;margin-top:10px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
</style></head><body>
<div id="vid"><img id="im"><div id="vig"></div><div id="topshade"></div></div>
<div id="bro"><img id="bim"></div>
<div id="pills"></div>
<div id="cap"></div>
<div id="end"><svg id="logo" width="760" height="500" viewBox="200 320 680 440"><polygon fill="#FCEF00" points="247,590 292,590 318,690 430,427 370,427 492,352 540,427 470,427 345,728 290,728"/><g fill="#fff" font-family="MI" font-weight="900" font-style="italic" font-size="196"><text x="243" y="580" textLength="120" lengthAdjust="spacingAndGlyphs">S</text><text x="436" y="580" textLength="398" lengthAdjust="spacingAndGlyphs">RAD</text><text x="352" y="728" textLength="400" lengthAdjust="spacingAndGlyphs">ERT</text></g></svg><div id="endpill"></div></div>
<div id="bar"></div>
<script>
const FPS=30;let D,CAPS,CUTS,DUR,VD;
const ease=x=>{x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3)};
const prog=(t,s,d=0.4)=>ease((t-s)/d);
const io=(t,s,e,d=0.4)=>Math.min(prog(t,s,d),1-prog(t,e-0.3,0.3));   // in / out envelope
const $=id=>document.getElementById(id);
const pad=(n,k=5)=>String(n).padStart(k,'0');
async function setImg(el,src){if(el.dataset.s===src)return;el.dataset.s=src;await new Promise(r=>{el.onload=r;el.onerror=()=>{console.log('IMGERR '+src);r()};el.src=src});if(el.decode){try{await el.decode()}catch(e){}}}
// "plain **key words** plain" -> highlight span with a yellow wipe behind it
const hl=s=>s.replace(/\*\*(.+?)\*\*/g,'<span class="hl"><i></i>$1</span>');
window.render=async function(f){
 const t=f/FPS,im=$('im');
 // slow push-in that resets on every cut
 let ci=0;for(let i=0;i<CUTS.length-1;i++)if(t>=CUTS[i]-1e-3)ci=i;
 const sp=Math.min(1,(t-CUTS[ci])/(CUTS[ci+1]-CUTS[ci]));const fo=D.focus||[52,36];
 im.style.transformOrigin=`${fo[0]}% ${fo[1]}%`;im.style.transform=`scale(${(1.01+0.035*sp).toFixed(5)})`;
 // b-roll card on top, talking head shrinks into a rounded card underneath
 let k=0,bi=-1;(D.broll||[]).forEach((b,i)=>{const kk=Math.min(prog(t,b.s),1-prog(t,b.e));if(kk>k){k=kk;bi=i}});
 const v=$('vid');v.style.left=(80*k)+'px';v.style.top=(930*k)+'px';v.style.width=(1080-160*k)+'px';v.style.height=(1920-1090*k)+'px';v.style.borderRadius=(48*k)+'px';
 im.style.width=(1080-160*k)+'px';im.style.top=((D.shrinkTop===undefined?-450:D.shrinkTop)*k)+'px';$('topshade').style.opacity=1-k;
 const bro=$('bro');if(bi<0){bro.style.opacity=0;}else{const b=D.broll[bi];bro.style.top=(b.y||330)+'px';bro.style.height=(b.h||560)+'px';bro.style.opacity=Math.min(1,k*k*1.6);bro.style.transform=`translateY(${((1-k)*40).toFixed(2)}px)`;
  const n=Math.max(1,Math.min(b.n,Math.round((t-b.s)*FPS)+1));const bim=$('bim');bim.style.transform=`scale(${(1.02+0.05*Math.max(0,Math.min(1,(t-b.s)/(b.e-b.s)))).toFixed(5)})`;await setImg(bim,`${b.dir}/${pad(n)}.jpg`);}
 await setImg(im,'frames/'+pad(Math.min(D.nf,f+1))+'.jpg');
 $('bar').style.width=(1080*t/DUR)+'px';
 // pills and small sub lines
 [...$('pills').children].forEach((el,i)=>{const p=D.pills[i];el.style.opacity=io(t,p.s,p.e);el.style.transform=p.sub?`translateY(${((1-prog(t,p.s))*18).toFixed(2)}px)`:`translate(-50%,${((1-prog(t,p.s))*26).toFixed(2)}px)`;
  el.querySelectorAll('.hl i').forEach(x=>{x.style.transform=`scaleX(${prog(t,p.wipe===undefined?p.s+0.45:p.wipe,0.45)})`});});
 // captions: one short group at a time, the spoken word gets the yellow block
 const cap=$('cap');let gi=-1;for(let i=0;i<CAPS.length;i++)if(t>=CAPS[i][0][1]-0.04)gi=i;
 let show=gi>=0&&t<D.lastEnd+0.2;
 if(show&&gi<CAPS.length-1){const nx=CAPS[gi+1][0][1],lw=CAPS[gi][CAPS[gi].length-1][1];if(nx-lw>1.3&&t>lw+0.9)show=false;}
 if(!show){cap.style.opacity=0;}else{const g=CAPS[gi];if(cap.dataset.g!=gi){cap.dataset.g=gi;cap.innerHTML=g.map(w=>`<span>${w[0]}</span>`).join('');}
  let wi=0;g.forEach((w,i)=>{if(t>=w[1]-0.04)wi=i});[...cap.children].forEach((s,i)=>{s.className=i==wi?'on':''});
  const p=prog(t,g[0][1]-0.04,0.16);cap.style.opacity=p;cap.style.transform=`translate(-50%,${((1-p)*10).toFixed(2)}px)`;}
 // end card
 const es=VD+0.02;$('end').style.opacity=prog(t,es,0.35);$('logo').style.transform=`scale(${(0.96+0.04*prog(t,es+0.05,0.6)).toFixed(5)})`;
 const pl=$('endpill'),q=prog(t,es+0.3,0.4);pl.style.opacity=q;pl.style.transform=`translateY(${((1-q)*20).toFixed(2)}px)`;
};
window.ready=(async()=>{D=await (await fetch('data.json')).json();CAPS=D.caps;CUTS=D.cuts;VD=D.vd;DUR=D.total/FPS;
 $('pills').innerHTML=(D.pills||[]).map(p=>p.sub?`<div class="sub">${p.text}</div>`:`<div class="pill">${hl(p.text)}</div>`).join('');
 $('cap').className=D.capPlate===false?'bare':'plate';if(D.capTop)$('cap').style.top=D.capTop+'px';$('endpill').textContent=D.link||'stradvert.org';
 for(const f of['800 60px M','700 60px M','600 60px M','500 60px M','italic 900 60px MI'])await document.fonts.load(f);await document.fonts.ready;})();
</script></body></html>
