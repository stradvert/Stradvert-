<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stradvert — Intro</title>
<style>
  :root {
    --bg: #0D1321;
    --bg-2: #1D2D44;
    --fg-dim: #3E5C76;
    --accent: #748CAB;
    --fg: #F0EBD8;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
  }
  * { box-sizing: border-box; }

  [data-composition-id="stradvert-intro"] {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'DM Sans', sans-serif;
  }

  /* Layer 1: asymmetric ambient depth — two offset radial tints */
  .depth {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 22% 28%, rgba(29, 45, 68, 0.55) 0%, transparent 48%),
      radial-gradient(circle at 78% 74%, rgba(29, 45, 68, 0.38) 0%, transparent 52%);
    pointer-events: none;
    z-index: 1;
  }

  /* Layer 1b: central breathing glow */
  .glow {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 1200px;
    height: 1200px;
    background: radial-gradient(
      circle,
      rgba(116, 140, 171, 0.22) 0%,
      rgba(116, 140, 171, 0.08) 42%,
      transparent 70%
    );
    pointer-events: none;
    z-index: 1;
    transform-origin: center;
  }

  /* Layer 3: content — filling scene via flex + padding (no absolute positioning) */
  .scene-content {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
    padding: 240px 80px;
    gap: 40px;
  }

  .overline {
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 32px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
    text-indent: 0.42em; /* balance the tracking visually */
  }

  .rule {
    width: 200px;
    height: 2px;
    background: var(--accent);
    transform-origin: center;
  }

  .title {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 200px;
    letter-spacing: -0.045em;
    line-height: 1;
    color: var(--fg);
    margin: 0;
    text-align: center;
  }

  .tagline {
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 36px;
    letter-spacing: 0.04em;
    color: var(--fg);
    margin: 0;
    text-align: center;
  }
</style>
</head>
<body>
<div
  data-composition-id="stradvert-intro"
  data-start="0"
  data-duration="10"
  data-width="1080"
  data-height="1920"
  data-track-index="0"
>
  <div class="depth"></div>
  <div class="glow"></div>
  <div class="scene-content">
    <p class="overline">Introducing</p>
    <div class="rule"></div>
    <h1 class="title">Stradvert</h1>
    <p class="tagline">AI outreach, automated.</p>
  </div>
</div>

<script src="gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // Build — staggered entrances, varied eases, offset from t=0
  tl.from('.overline', {
    opacity: 0,
    letterSpacing: '0.9em',
    duration: 0.9,
    ease: 'sine.out'
  }, 0.3);

  tl.from('.rule', {
    scaleX: 0,
    duration: 0.8,
    ease: 'expo.out'
  }, 0.7);

  tl.from('.title', {
    opacity: 0,
    y: 60,
    duration: 1.4,
    ease: 'power4.out'
  }, 1.1);

  tl.from('.tagline', {
    opacity: 0,
    y: 18,
    duration: 0.7,
    ease: 'power2.out'
  }, 2.3);

  // Breathe — ambient glow opacity pulse (not zoom). Single yoyo inside duration.
  tl.fromTo('.glow',
    { opacity: 0.75 },
    {
      opacity: 1,
      duration: 3.2,
      ease: 'sine.inOut',
      yoyo: true,
      repeat: 1
    }, 3.2);

  window.__timelines['stradvert-intro'] = tl;
</script>
</body>
</html>
